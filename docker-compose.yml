# =====================================================================
#  Infrastructure du projet DS Microservices
#  (MySQL x3, Axon Server, Zipkin, Prometheus, Grafana)
#
#  1) Infrastructure seule (les microservices tournent dans IntelliJ) :
#       docker compose up -d
#  2) Tout dans Docker (après "mvn clean package -DskipTests") :
#       PROMETHEUS_CONFIG=prometheus-docker.yml docker compose --profile apps up -d --build
# =====================================================================
name: foyer-microservices

services:
  # ---------- Une base de données indépendante par microservice ----------
  mysql-foyer:
    image: mysql:8.0
    container_name: mysql-foyer
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: foyer_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-foyer-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  mysql-universite:
    image: mysql:8.0
    container_name: mysql-universite
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: universite_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-universite-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  mysql-bloc:
    image: mysql:8.0
    container_name: mysql-bloc
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: bloc_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-bloc-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  # ---------- CQRS : Axon Server (event store + bus de commandes/requêtes) ----------
  axonserver:
    image: axoniq/axonserver:latest
    container_name: axonserver
    hostname: axonserver
    environment:
      AXONIQ_AXONSERVER_STANDALONE: "true"     # crée automatiquement le contexte "default"
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "true" # permet de vider l'event store depuis l'interface
    ports:
      - "8024:8024"   # interface web
      - "8124:8124"   # gRPC (applications)
    volumes:
      - axonserver-data:/axonserver/data
      - axonserver-events:/axonserver/events

  # ---------- Traçabilité ----------
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"

  # ---------- Métriques ----------
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # prometheus-local.yml : microservices lancés sur la machine (IntelliJ)
      # prometheus-docker.yml : microservices lancés dans Docker (découverte via Eureka)
      - ./monitoring/prometheus/${PROMETHEUS_CONFIG:-prometheus-local.yml}:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # utile sous Linux (déjà fourni par Docker Desktop Mac/Windows)

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # =====================================================================
  #  Profil "apps" : les microservices eux-mêmes dans Docker
  # =====================================================================
  config-server:
    profiles: ["apps"]
    build: ./config-server
    container_name: config-server
    environment:
      CONFIG_REPO_PATH: file:/config-repo/
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"

  eureka-server:
    profiles: ["apps"]
    build: ./eureka-server
    container_name: eureka-server
    environment:
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8761:8761"

  gateway-service:
    profiles: ["apps"]
    build: ./gateway-service
    container_name: gateway-service
    environment: &client-env
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP: "true"
      ZIPKIN_URL: http://zipkin:9411
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - eureka-server

  foyer-service-1:
    profiles: ["apps"]
    build: ./foyer-service
    container_name: foyer-service-1
    environment:
      <<: *client-env
      INSTANCE_NAME: foyer-1
      DB_HOST: mysql-foyer
      DB_PORT: "3306"
      AXON_SERVER: axonserver:8124
    ports:
      - "8081:8081"
    depends_on:
      mysql-foyer:
        condition: service_healthy
      config-server:
        condition: service_started
      axonserver:
        condition: service_started

  foyer-service-2:
    profiles: ["apps"]
    build: ./foyer-service
    container_name: foyer-service-2
    environment:
      <<: *client-env
      INSTANCE_NAME: foyer-2
      DB_HOST: mysql-foyer
      DB_PORT: "3306"
      AXON_SERVER: axonserver:8124
    ports:
      - "8083:8081"
    depends_on:
      mysql-foyer:
        condition: service_healthy
      config-server:
        condition: service_started
      axonserver:
        condition: service_started

  universite-service:
    profiles: ["apps"]
    build: ./universite-service
    container_name: universite-service
    environment:
      <<: *client-env
      DB_HOST: mysql-universite
      DB_PORT: "3306"
    ports:
      - "8082:8082"
    depends_on:
      mysql-universite:
        condition: service_healthy
      config-server:
        condition: service_started

  bloc-service:
    profiles: ["apps"]
    build: ./bloc-service
    container_name: bloc-service
    environment:
      <<: *client-env
      DB_HOST: mysql-bloc
      DB_PORT: "3306"
    ports:
      - "8084:8084"
    depends_on:
      mysql-bloc:
        condition: service_healthy
      config-server:
        condition: service_started

  frontend:
    profiles: ["apps"]
    build: ./frontend
    container_name: frontend
    environment:
      BACKEND_HOST: gateway-service
    ports:
      - "4200:80"
    depends_on:
      - gateway-service

volumes:
  mysql-foyer-data:
  mysql-universite-data:
  mysql-bloc-data:
  axonserver-data:
  axonserver-events:
