spring:
  application:
    name: gateway-service
  config:
    # la configuration (port, routes, eureka...) vient du Config Server : config-repo/gateway-service.yml
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        max-interval: 5000
