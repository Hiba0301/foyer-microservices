# Microservices lancés sur la machine (IntelliJ / mvn spring-boot:run) :
# Prometheus (dans Docker) les joint via host.docker.internal.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # gateway-service
          - host.docker.internal:8081   # foyer-service (instance 1)
          - host.docker.internal:8083   # foyer-service (instance 2)
          - host.docker.internal:8082   # universite-service
          - host.docker.internal:8084   # bloc-service
          - host.docker.internal:8761   # eureka-server

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
