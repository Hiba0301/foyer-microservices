spring:
  application:
    name: universite-service
  config:
    # tout le reste (port, base, eureka, resilience4j...) vient du Config Server : config-repo/universite-service.yml
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        max-interval: 5000
